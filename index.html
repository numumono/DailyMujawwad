    <style>
        :root {
            --bg-corporate: #fdf6e3; 
            --text-main: #333333;
            --card-bg: #ffffff;
            --border-light: #e5e7eb;
            --primary: #1f2937; 
            --primary-hover: #111827;
            --correct-bg: #dcfce7;
            --correct-border: #86efac;
            --correct-text: #166534;
            --wrong-bg: #fee2e2;
            --wrong-border: #fca5a5;
            --wrong-text: #991b1b;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-corporate);
            color: var(--text-main);
            font-size: 1.125rem;
            line-height: 1.6;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            margin: 0;
        }

        .corporate-card {
            background-color: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            border: 1px solid var(--border-light);
            padding: 2.5rem;
            width: 100%;
            max-width: 750px;
            margin: 0 auto;
        }

        .arabic-text {
            font-family: 'Amiri', serif;
            font-size: 3rem;
            font-weight: 700;
            line-height: 1.6;
            color: var(--text-main);
            direction: rtl;
        }

        .highlight-arabic {
            color: #b91c1c;
        }

        .btn-option {
            background-color: #f8fafc;
            color: var(--text-main);
            border: 2px solid var(--border-light);
            border-radius: 10px;
            transition: all 0.2s ease;
            font-weight: 600;
            text-align: left;
            padding: 1.25rem 1.5rem;
            width: 100%;
            display: flex;
            align-items: center;
            font-size: 1.125rem;
            cursor: pointer;
        }
        
        .btn-option:hover:not(:disabled) {
            background-color: #f1f5f9;
            border-color: #cbd5e1;
        }

        .btn-option:disabled {
            cursor: not-allowed;
            opacity: 0.7;
        }

        .btn-correct {
            background-color: var(--correct-bg) !important;
            border-color: var(--correct-border) !important;
            color: var(--correct-text) !important;
            opacity: 1 !important;
        }

        .btn-wrong {
            background-color: var(--wrong-bg) !important;
            border-color: var(--wrong-border) !important;
            color: var(--wrong-text) !important;
            opacity: 1 !important;
        }

        .btn-primary {
            background-color: var(--primary);
            color: white;
            border-radius: 10px;
            padding: 1rem 2.5rem;
            font-weight: 700;
            font-size: 1.125rem;
            transition: background-color 0.2s ease;
            cursor: pointer;
            border: none;
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
        }

        .screen-container {
            display: none;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .screen-active {
            display: block;
            opacity: 1;
        }

        .link-corporate {
            color: #2563eb;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s;
        }

        .link-corporate:hover {
            color: #1d4ed8;
            text-decoration: underline;
        }
    </style>
</head>

    <main class="flex-grow flex items-center justify-center py-10 px-4 w-full">

            { q: "Apabila menyebut [صُ], pangkal lidah...", word: "صُ", opts: ["Naik", "Turun mendatar"], ans: 0, exp: "[صُ] tebal, pangkal lidah naik." },
            { q: "Apabila menyebut [صۡ], pangkal lidah...", word: "صۡ", opts: ["Naik", "Turun mendatar"], ans: 0, exp: "[صۡ] tebal, pangkal lidah naik." },

            { q: "Apabila menyebut [دۡ], pangkal lidah...", word: "دۡ", opts: ["Turun mendatar", "Naik"], ans: 0, exp: "[دۡ] nipis, pangkal lidah turun." }
        ];

        // BANK SOALAN LANJUTAN (15 Soalan - Kalimah Rasm Uthmani)
        const bankLanjutan = [
            { q: "Semasa menyebut [خَـٰلِدِينَ], apakah keadaan pangkal lidah pada [خَ]?", word: "<span class='highlight-arabic'>خَـٰ</span>لِدِينَ", opts: ["Naik", "Turun mendatar"], ans: 0, exp: "Dalam kalimah [خَـٰلِدِينَ], [خَ] tebal, pangkal lidah mesti naik." },
            { q: "Semasa menyebut [ٱلۡمُسۡتَقِيمَ], apakah keadaan pangkal lidah pada [قِ]?", word: "ٱلۡمُسۡتَ<span class='highlight-arabic'>قِ</span>يمَ", opts: ["Naik", "Turun mendatar"], ans: 0, exp: "Dalam kalimah [ٱلۡمُسۡتَقِيمَ], [قِ] tebal, pangkal lidah mesti naik." },
            { q: "Semasa menyebut [ٱلضَّآلِّينَ], apakah keadaan pangkal lidah pada [ضَّ]?", word: "ٱل<span class='highlight-arabic'>ضَّ</span>آلِّينَ", opts: ["Naik", "Turun mendatar"], ans: 0, exp: "Dalam kalimah [ٱلضَّآلِّينَ], [ضَّ] tebal, pangkal lidah mesti naik." },
            { q: "Semasa menyebut [يَخۡطَفُ], apakah keadaan pangkal lidah pada [خۡ]?", word: "يَ<span class='highlight-arabic'>خۡ</span>طَفُ", opts: ["Naik", "Turun mendatar"], ans: 0, exp: "Dalam kalimah [يَخۡطَفُ], [خۡ] tebal, pangkal lidah mesti naik." },
            { q: "Semasa menyebut [غِشَـٰوَةٌۭ], apakah keadaan pangkal lidah pada [غِ]?", word: "<span class='highlight-arabic'>غِ</span>شَـٰوَةٌۭ", opts: ["Naik", "Turun mendatar"], ans: 0, exp: "Dalam kalimah [غِشَـٰوَةٌۭ], [غِ] tebal, pangkal lidah mesti naik." },
            { q: "Semasa menyebut [ظَلَمُوا۟], apakah keadaan pangkal lidah pada [ظَ]?", word: "<span class='highlight-arabic'>ظَ</span>لَمُوا۟", opts: ["Naik", "Turun mendatar"], ans: 0, exp: "Dalam kalimah [ظَلَمُوا۟], [ظَ] tebal, pangkal lidah mesti naik." },
            { q: "Semasa menyebut [صِرَٰطَ], apakah keadaan pangkal lidah pada [صِ]?", word: "<span class='highlight-arabic'>صِ</span>رَٰطَ", opts: ["Naik", "Turun mendatar"], ans: 0, exp: "Dalam kalimah [صِرَٰطَ], [صِ] tebal, pangkal lidah mesti naik." },
            { q: "Semasa menyebut [يَخۡشَىٰ], apakah keadaan pangkal lidah pada [خۡ]?", word: "يَ<span class='highlight-arabic'>خۡ</span>شَىٰ", opts: ["Naik", "Turun mendatar"], ans: 0, exp: "Dalam kalimah [يَخۡشَىٰ], [خۡ] tebal, pangkal lidah mesti naik." },
            { q: "Semasa menyebut [فَطَالَ], apakah keadaan pangkal lidah pada [طَ]?", word: "فَ<span class='highlight-arabic'>طَ</span>الَ", opts: ["Naik", "Turun mendatar"], ans: 0, exp: "Dalam kalimah [فَطَالَ], [طَ] tebal, pangkal lidah mesti naik." },
            { q: "Semasa menyebut [ٱلۡقَارِعَةُ], apakah keadaan pangkal lidah pada [قَ]?", word: "ٱلۡ<span class='highlight-arabic'>قَ</span>ارِعَةُ", opts: ["Naik", "Turun mendatar"], ans: 0, exp: "Dalam kalimah [ٱلۡقَارِعَةُ], [قَ] tebal, pangkal lidah mesti naik." },
            { q: "Semasa menyebut [مَغۡضُوبِ], apakah keadaan pangkal lidah pada [غۡ]?", word: "مَ<span class='highlight-arabic'>غۡ</span>ضُوبِ", opts: ["Naik", "Turun mendatar"], ans: 0, exp: "Dalam kalimah [مَغۡضُوبِ], [غۡ] tebal, pangkal lidah mesti naik." },

            { q: "Semasa menyebut [يُظۡهِرَ], apakah keadaan pangkal lidah pada [ظۡ]?", word: "يُ<span class='highlight-arabic'>ظۡ</span>هِرَ", opts: ["Naik", "Turun mendatar"], ans: 0, exp: "Dalam kalimah [يُظۡهِرَ], [ظۡ] tebal, pangkal lidah mesti naik." },
            { q: "Semasa menyebut [مَرَضٌۭ], apakah keadaan pangkal lidah pada [ضٌ]?", word: "مَرَ<span class='highlight-arabic'>ضٌ</span>ۭ", opts: ["Naik", "Turun mendatar"], ans: 0, exp: "Dalam kalimah [مَرَضٌۭ], [ضٌ] tebal, pangkal lidah mesti naik." }
        ];

        let soalanSesi = [];
        let indeksSoalan = 0;
        let markah = 0;

        // Fungsi rombak rawak (Fisher-Yates)
        function rombakArray(array) {
            let arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        // Fungsi tukar paparan
        function tunjukSkrin(id) {
            document.querySelectorAll('.screen-container').forEach(el => {
                el.classList.remove('screen-active');
            });
            document.getElementById(id).classList.add('screen-active');
        }

        // Mula Kuiz
        function startQuiz() {
            // Pilih 5 asas, 5 lanjutan
            let pilihanAsas = rombakArray(bankAsas).slice(0, 5).map(q => ({...q, jenis: 'Asas'}));
            let pilihanLanjutan = rombakArray(bankLanjutan).slice(0, 5).map(q => ({...q, jenis: 'Lanjutan'}));
            
            // Gabung dan rombak
            soalanSesi = rombakArray([...pilihanAsas, ...pilihanLanjutan]);
            
            indeksSoalan = 0;
            markah = 0;
            tunjukSkrin('quiz-screen');
            muatSoalan();
        }

        function muatSoalan() {
            document.getElementById('feedback-panel').classList.add('hidden');
            document.getElementById('next-btn').classList.add('hidden');
            
            const dataSoalan = soalanSesi[indeksSoalan];
            
            document.getElementById('question-progress').innerText = `${indeksSoalan + 1} / 10`;
            
            const badgeJenis = document.getElementById('question-type');
            badgeJenis.innerText = dataSoalan.jenis;
            if (dataSoalan.jenis === 'Lanjutan') {
                badgeJenis.className = "bg-blue-100 text-blue-800 text-sm font-bold px-4 py-1.5 rounded-full uppercase tracking-wider";
            } else {
                badgeJenis.className = "bg-gray-100 text-gray-700 text-sm font-bold px-4 py-1.5 rounded-full uppercase tracking-wider";
            }

            document.getElementById('question-text').innerHTML = dataSoalan.q;
            document.getElementById('arabic-word-container').innerHTML = dataSoalan.word;

            const bekasPilihan = document.getElementById('options-container');
            bekasPilihan.innerHTML = '';
            
            let pilihanDenganIndeks = dataSoalan.opts.map((teks, idx) => ({ teks, idxAsal: idx }));
            pilihanDenganIndeks = rombakArray(pilihanDenganIndeks);

            pilihanDenganIndeks.forEach((pilihan) => {
                const butang = document.createElement('button');
                butang.className = "btn-option";
                butang.innerHTML = `
                    <span class="w-6 h-6 border-2 border-gray-400 rounded-full mr-4 flex-shrink-0 flex items-center justify-center"></span> 
                    <span>${pilihan.teks}</span>
                `;
                butang.onclick = () => semakJawapan(pilihan.idxAsal, dataSoalan.ans, dataSoalan.exp, butang, bekasPilihan);
                bekasPilihan.appendChild(butang);
            });
        }

        function semakJawapan(idxDipilih, idxTepat, penerangan, butangKlik, bekas) {
            const semuaButang = bekas.getElementsByTagName('button');
            for (let btn of semuaButang) {
                btn.disabled = true;
            }

            const panelMaklumBalas = document.getElementById('feedback-panel');
            const tajukMaklumBalas = document.getElementById('feedback-title');
            const mesejMaklumBalas = document.getElementById('feedback-message');

            panelMaklumBalas.classList.remove('hidden', 'bg-[#dcfce7]', 'border-[#86efac]', 'text-[#166534]', 'bg-[#fee2e2]', 'border-[#fca5a5]', 'text-[#991b1b]');

            const bulatan = butangKlik.querySelector('span');

            if (idxDipilih === idxTepat) {
                markah++;
                butangKlik.classList.add('btn-correct');
                bulatan.classList.add('bg-[#166534]', 'border-[#166534]');
                
                panelMaklumBalas.classList.add('bg-[#dcfce7]', 'border-[#86efac]', 'text-[#166534]');
                tajukMaklumBalas.innerText = "✓ Tepat";
            } else {
                butangKlik.classList.add('btn-wrong');
                bulatan.classList.add('bg-[#991b1b]', 'border-[#991b1b]');

                panelMaklumBalas.classList.add('bg-[#fee2e2]', 'border-[#fca5a5]', 'text-[#991b1b]');
                tajukMaklumBalas.innerText = "✗ Kurang Tepat";
                
                // Cari dan tandakan jawapan yang betul
                for (let btn of semuaButang) {
                    const teksSpan = btn.querySelectorAll('span')[1].innerText.trim();
                    const teksBetul = soalanSesi[indeksSoalan].opts[idxTepat];
                    if (teksSpan === teksBetul) {
                        btn.style.opacity = '1';
                        btn.style.border = '2px dashed #166534';
                        btn.querySelector('span').classList.add('border-[#166534]');
                    }
                }
            }

            mesejMaklumBalas.innerHTML = `<strong>Keterangan:</strong> ${penerangan}`;
            document.getElementById('next-btn').classList.remove('hidden');
        }

        function nextQuestion() {
            indeksSoalan++;
            if (indeksSoalan < 10) {
                muatSoalan();
            } else {
                tamatKuiz();
            }
        }

        function tamatKuiz() {
            tunjukSkrin('result-screen');
            document.getElementById('final-score').innerText = `${markah}/10`;
        }

        function restartQuiz() {
            startQuiz();
        }
    </script>
</body>
</html>
