<!DOCTYPE html>
<html lang="ms" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kuiz Interaktif Sifat Huruf (Tajwid)</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 font-sans text-gray-800 min-h-screen flex items-center justify-center p-4">

    <div class="max-w-2xl w-full bg-white rounded-xl shadow-lg p-6 md:p-8">
        
        <!-- Pengepala -->
        <div class="text-center border-b pb-4 mb-6">
            <h1 class="text-2xl font-bold text-indigo-700">Kuiz Sifat Huruf (Hams, Jahr, Shiddah, Tawassut, Rakhawah)</h1>
            <p class="text-sm text-gray-500 mt-2">Jawab 10 soalan rawak. Maklum balas akan diberikan serta-merta.</p>
        </div>

        <!-- Ruang Kuiz -->
        <div id="quiz-container">
            <div class="flex justify-between items-center mb-4">
                <span id="question-tracker" class="text-sm font-semibold text-indigo-600 bg-indigo-50 px-3 py-1 rounded-full">Soalan 1 / 10</span>
                <span id="score-tracker" class="text-sm font-semibold text-green-600">Markah: 0</span>
            </div>
            
            <h2 id="question-text" class="text-lg md:text-xl font-medium mb-6 leading-relaxed">Pemuatan soalan...</h2>
            
            <div id="options-container" class="space-y-3">
                <!-- Pilihan jawapan akan dijanakan di sini -->
            </div>

            <!-- Maklum Balas Jawapan -->
            <div id="feedback-container" class="mt-6 hidden p-4 rounded-lg border">
                <p id="feedback-status" class="font-bold text-lg mb-1"></p>
                <p id="feedback-reason" class="text-sm"></p>
            </div>
        </div>

        <!-- Keputusan Akhir -->
        <div id="result-container" class="hidden text-center">
            <h2 class="text-3xl font-bold mb-2">Kuiz Tamat!</h2>
            <p class="text-lg text-gray-700 mb-6">Markah anda: <span id="final-score" class="font-bold text-indigo-600 text-2xl"></span></p>
            <button onclick="initQuiz()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 px-6 rounded-lg transition">Cuba Lagi (Soalan Rawak)</button>
        </div>

        <!-- Butang Navigasi -->
        <div id="nav-buttons" class="flex justify-between mt-8 hidden">
            <button id="prev-btn" onclick="prevQuestion()" class="bg-gray-200 hover:bg-gray-300 text-gray-700 font-semibold py-2 px-4 rounded-lg transition disabled:opacity-50">Sebelumnya</button>
            <button id="next-btn" onclick="nextQuestion()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2 px-4 rounded-lg transition disabled:opacity-50">Seterusnya</button>
        </div>
    </div>

    <script>
        // Bank Soalan (Ditunjukkan sebahagian dari 50 soalan untuk contoh. Anda boleh tambah mengikut format ini)
        const questionBank = [
            {
                q: "Apakah sifat bagi huruf 'ت' (Ta)?",
                options: ["Hams dan Shiddah", "Jahr dan Rakhawah", "Hams dan Tawassut", "Jahr dan Shiddah"],
                answer: 0,
                reason: "Huruf 'ت' tergolong dalam Hams (فَحَثَّهُ شَخْصٌ سَكَتَ) yang melepaskan nafas, dan Shiddah (أَجِدْ قَطٍ بَكَتْ) yang menahan suara."
            },
            {
                q: "Huruf yang mempunyai sifat 'Tawassut' (pertengahan antara suara tertahan dan mengalir) terhimpun dalam rangkai kata:",
                options: ["أَجِدْ قَطٍ بَكَتْ", "لِنْ عُمَرْ", "فَحَثَّهُ شَخْصٌ سَكَتَ", "خُصَّ ضَغْطٍ قِظْ"],
                answer: 1,
                reason: "Rangkai kata 'لِنْ عُمَرْ' (Lam, Nun, 'Ain, Mim, Ra) mewakili sifat Tawassut di mana suara tidak tertahan sepenuhnya dan tidak mengalir sepenuhnya."
            },
            {
                q: "Sekatan pada laluan udara (nafas) yang menghasilkan kekuatan sebutan huruf dikenali sebagai sifat...",
                options: ["Al-Hams", "Ar-Rakhawah", "Al-Jahr", "At-Tawassut"],
                answer: 2,
                reason: "Al-Jahr (الجَهْر) bermaksud nafas tertahan atau tersekat ketika huruf disebut, menjadikan sebutannya jelas."
            },
            {
                q: "Perhatikan lafaz (ٱلْحَمْدُ). Apakah sifat utama huruf 'ح' ketika ia berbaris atas?",
                options: ["Hams dan Rakhawah", "Jahr dan Shiddah", "Hams dan Tawassut", "Jahr dan Rakhawah"],
                answer: 0,
                reason: "Huruf 'ح' melepaskan nafas (Hams: فَحَثَّهُ شَخْصٌ سَكَتَ) dan suaranya mengalir lembut (Rakhawah kerana ia tiada dalam huruf Shiddah/Tawassut)."
            },
            {
                q: "Di dalam ayat (إِيَّاكَ نَعْبُدُ), huruf 'ك' (Kaf) memiliki sifat Shiddah dan...",
                options: ["Tawassut", "Jahr", "Hams", "Rakhawah"],
                answer: 2,
                reason: "Huruf Kaf (ك) memiliki sifat Shiddah (suara tertahan/kuat) pada pangkalnya, tetapi disudahi dengan Hams (hembusan nafas kecil)."
            },
            {
                q: "Antara berikut, yang manakah BUKAN huruf yang bersifat 'Shiddah' (الشِّدَّة)?",
                options: ["ج (Jim)", "ط (Ta')", "س (Sin)", "ق (Qaf)"],
                answer: 2,
                reason: "Huruf Sin (س) bersifat Rakhawah (suara mengalir), manakala Jim, Ta' dan Qaf berada dalam kumpulan (أَجِدْ قَطٍ بَكَتْ)."
            },
            {
                q: "Dalam kalimah (بِسْمِ ٱللَّهِ), huruf 'س' yang mati (sukun) perlu disempurnakan sifat...",
                options: ["Hams dan Rakhawah", "Jahr dan Shiddah", "Tawassut dan Jahr", "Shiddah dan Hams"],
                answer: 0,
                reason: "Sin yang sukun perlu dialirkan nafas (Hams) dan dilembutkan aliran suaranya (Rakhawah) agar ia kedengaran jelas bunyinya."
            },
            {
                q: "Apakah perbezaan utama antara sifat Hams dan Jahr?",
                options: ["Aliran Suara (Bunyi)", "Aliran Udara (Nafas)", "Ketebalan Lidah", "Kedudukan Bibir"],
                answer: 1,
                reason: "Hams mengalirkan nafas, manakala Jahr menahan nafas. (Manakala Shiddah dan Rakhawah adalah berkaitan aliran suara/bunyi)."
            },
            {
                q: "Huruf 'م' (Mim) dan 'ن' (Nun) dikategorikan dalam sifat...",
                options: ["Shiddah", "Rakhawah", "Tawassut", "Hams"],
                answer: 2,
                reason: "Mim dan Nun tergolong dalam huruf Tawassut (لِنْ عُمَرْ). Suara tidak disekat habis seperti Shiddah, dan tidak dilepas terus seperti Rakhawah."
            },
            {
                q: "Huruf-huruf (ف ح ث ه ش خ ص س ك ت) adalah kumpulan huruf bagi sifat...",
                options: ["Al-Hams", "Al-Jahr", "Ash-Shiddah", "At-Tawassut"],
                answer: 0,
                reason: "Ia adalah himpunan huruf Hams (nafas terlepas) melalui rangkai kata فَحَثَّهُ شَخْصٌ سَكَتَ."
            }
        ];

        let selectedQuestions = [];
        let currentQuestionIndex = 0;
        let score = 0;
        let userAnswers = []; // Menyimpan rekod jawapan pengguna

        function shuffleArray(array) {
            let shuffled = [...array];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        }

        function initQuiz() {
            // Pilih 10 soalan rawak (atau sebanyak mana dalam bank jika kurang dari 10)
            const numQuestions = Math.min(10, questionBank.length);
            const shuffledBank = shuffleArray(questionBank);
            selectedQuestions = shuffledBank.slice(0, numQuestions).map(q => {
                // Rombak pilihan jawapan
                const optionsWithIndex = q.options.map((opt, index) => ({ text: opt, isCorrect: index === q.answer }));
                const shuffledOptions = shuffleArray(optionsWithIndex);
                const correctIndex = shuffledOptions.findIndex(o => o.isCorrect);
                
                return {
                    q: q.q,
                    options: shuffledOptions.map(o => o.text),
                    answer: correctIndex,
                    reason: q.reason
                };
            });

            currentQuestionIndex = 0;
            score = 0;
            userAnswers = new Array(numQuestions).fill(null);
            
            document.getElementById('result-container').classList.add('hidden');
            document.getElementById('quiz-container').classList.remove('hidden');
            document.getElementById('nav-buttons').classList.remove('hidden');
            
            loadQuestion();
        }

        function loadQuestion() {
            const currentQ = selectedQuestions[currentQuestionIndex];
            document.getElementById('question-tracker').innerText = `Soalan ${currentQuestionIndex + 1} / ${selectedQuestions.length}`;
            document.getElementById('score-tracker').innerText = `Markah: ${score}`;
            document.getElementById('question-text').innerText = currentQ.q;
            
            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';
            
            const feedbackContainer = document.getElementById('feedback-container');
            feedbackContainer.classList.add('hidden');

            const hasAnswered = userAnswers[currentQuestionIndex] !== null;

            currentQ.options.forEach((opt, index) => {
                const btn = document.createElement('button');
                btn.className = `w-full text-left p-4 rounded-lg border-2 transition-all duration-200 font-medium ${hasAnswered ? 'cursor-not-allowed' : 'hover:bg-indigo-50 hover:border-indigo-300'}`;
                btn.innerText = opt;
                btn.disabled = hasAnswered;
                
                if (hasAnswered) {
                    // Beri gaya visual pada jawapan terdahulu
                    const isCorrectOption = index === currentQ.answer;
                    const isUserPick = index === userAnswers[currentQuestionIndex];
                    
                    if (isCorrectOption) {
                        btn.classList.add('bg-green-100', 'border-green-500', 'text-green-800');
                    } else if (isUserPick && !isCorrectOption) {
                        btn.classList.add('bg-red-100', 'border-red-500', 'text-red-800');
                    } else {
                        btn.classList.add('bg-gray-50', 'border-gray-200', 'text-gray-400');
                    }
                } else {
                    btn.classList.add('bg-white', 'border-gray-200');
                    btn.onclick = () => selectAnswer(index);
                }
                
                optionsContainer.appendChild(btn);
            });

            // Tunjuk maklum balas jika sudah dijawab
            if (hasAnswered) {
                showFeedback(userAnswers[currentQuestionIndex] === currentQ.answer, currentQ.reason);
            }

            // Kemas kini butang navigasi
            document.getElementById('prev-btn').disabled = currentQuestionIndex === 0;
            const nextBtn = document.getElementById('next-btn');
            if (currentQuestionIndex === selectedQuestions.length - 1) {
                nextBtn.innerText = 'Lihat Keputusan';
                nextBtn.classList.replace('bg-indigo-600', 'bg-green-600');
                nextBtn.classList.replace('hover:bg-indigo-700', 'hover:bg-green-700');
            } else {
                nextBtn.innerText = 'Seterusnya';
                nextBtn.classList.replace('bg-green-600', 'bg-indigo-600');
                nextBtn.classList.replace('hover:bg-green-700', 'hover:bg-indigo-700');
            }
        }

        function selectAnswer(selectedIndex) {
            const currentQ = selectedQuestions[currentQuestionIndex];
            const isCorrect = selectedIndex === currentQ.answer;
            
            userAnswers[currentQuestionIndex] = selectedIndex;
            if (isCorrect) score += 10; // 10 markah per soalan
            
            loadQuestion(); // Muat semula visual (kunci butang dan serlah jawapan)
            showFeedback(isCorrect, currentQ.reason);
        }

        function showFeedback(isCorrect, reason) {
            const feedbackContainer = document.getElementById('feedback-container');
            const feedbackStatus = document.getElementById('feedback-status');
            const feedbackReason = document.getElementById('feedback-reason');

            feedbackContainer.classList.remove('hidden', 'bg-green-50', 'border-green-400', 'bg-red-50', 'border-red-400');
            
            if (isCorrect) {
                feedbackContainer.classList.add('bg-green-50', 'border-green-400', 'text-green-900');
                feedbackStatus.innerText = '✅ Jawapan Tepat!';
            } else {
                feedbackContainer.classList.add('bg-red-50', 'border-red-400', 'text-red-900');
                feedbackStatus.innerText = '❌ Jawapan Kurang Tepat';
            }
            
            feedbackReason.innerText = reason;
        }

        function nextQuestion() {
            if (currentQuestionIndex < selectedQuestions.length - 1) {
                currentQuestionIndex++;
                loadQuestion();
            } else {
                showResults();
            }
        }

        function prevQuestion() {
            if (currentQuestionIndex > 0) {
                currentQuestionIndex--;
                loadQuestion();
            }
        }

        function showResults() {
            document.getElementById('quiz-container').classList.add('hidden');
            document.getElementById('nav-buttons').classList.add('hidden');
            document.getElementById('result-container').classList.remove('hidden');
            document.getElementById('final-score').innerText = `${score} / ${selectedQuestions.length * 10}`;
        }

        // Mulakan kuiz bila halaman dimuatkan
        window.onload = initQuiz;
    </script>
</body>
</html>
